<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <ellipse cx="180" cy="120" rx="220" ry="120" fill="#FFFFFF" opacity="0.06" />

  <!-- Bag drop shadow -->
  <ellipse cx="256" cy="410" rx="120" ry="18" fill="#0F172A" opacity="0.18" />

  <g filter="url(#softShadow)">
    <!-- Bag body -->
    <path d="M 172 200 L 340 200 L 366 392 Q 366 404 354 404 L 158 404 Q 146 404 146 392 Z" fill="url(#bagGrad)" />

    <!-- Bag side shading for depth -->
    <path d="M 312 200 L 340 200 L 366 392 Q 366 404 354 404 L 332 404 Z" fill="#1D4ED8" opacity="0.12" />

    <!-- Bag top fold -->
    <rect x="166" y="188" width="180" height="22" rx="7" fill="#1D4ED8" />

    <!-- Handles -->
    <path d="M 205 197 C 205 148 245 148 245 197" fill="none" stroke="#EFF6FF" stroke-width="11" stroke-linecap="round" />
    <path d="M 267 197 C 267 148 307 148 307 197" fill="none" stroke="#EFF6FF" stroke-width="11" stroke-linecap="round" />
  </g>

  <!-- Chart/graph panel -->
  <rect x="182" y="210" width="148" height="175" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />

  <!-- Ascending bar graph -->
  <rect x="192" y="337" width="20" height="35" rx="3" fill="url(#barGrad)" />
  <rect x="218" y="317" width="20" height="55" rx="3" fill="url(#barGrad)" />
  <rect x="244" y="297" width="20" height="75" rx="3" fill="url(#barGrad)" />

  <!-- Warehouse -->
  <polygon points="253,262 311,262 282,238" fill="#059669" stroke="#047857" stroke-width="1.5" stroke-linejoin="round" />
  <rect x="258" y="262" width="48" height="34" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2.5" />
  <rect x="274" y="280" width="14" height="16" fill="#1D4ED8" />

  <!-- Stacked cardboard boxes above warehouse -->
  <g stroke="#94A3B8" stroke-width="2" stroke-linejoin="round">
    <rect x="250" y="232" width="22" height="22" rx="2" fill="#FFFFFF" />
    <line x1="250" y1="241" x2="272" y2="241" stroke="#CBD5E1" stroke-width="1.5" />

    <rect x="280" y="232" width="22" height="22" rx="2" fill="#FFFFFF" />
    <line x1="280" y1="241" x2="302" y2="241" stroke="#CBD5E1" stroke-width="1.5" />

    <rect x="265" y="206" width="22" height="22" rx="2" fill="#FFFFFF" />
    <line x1="265" y1="215" x2="287" y2="215" stroke="#CBD5E1" stroke-width="1.5" />
  </g>
</svg>
