# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - smartstock

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Assemble standalone package
        run: |
          # Copy public assets and static chunks
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          
          # Copy required build manifests specifically (prevents recursive copy loop)
          cp .next/BUILD_ID .next/standalone/.next/ 2>/dev/null || true
          cp .next/*.json .next/standalone/.next/ 2>/dev/null || true

      - name: Zip standalone output for deployment
        run: |
          cd .next/standalone
          zip -r ../../release.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Required for requesting JWT
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DE46C17653A54EACA0ACB0DBE22224F0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6BADAD642B67484DA566C5DC01823B9E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9FA018F914504B5D888F5C6DE00EEDE1 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'smartstock'
          slot-name: 'Production'
          package: release.zip
          startup-command: 'node server.js'
