# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - smartstock

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Assemble standalone package
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          # Copy all build metadata (BUILD_ID, manifests, server chunks)
          cp -r .next/* .next/standalone/.next/ 2>/dev/null || true
          # Re-ensure static files are placed properly
          cp -r .next/static .next/standalone/.next/static
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DE46C17653A54EACA0ACB0DBE22224F0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6BADAD642B67484DA566C5DC01823B9E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9FA018F914504B5D888F5C6DE00EEDE1 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'smartstock'
          slot-name: 'Production'
          package: .
          startup-command: 'node server.js'
